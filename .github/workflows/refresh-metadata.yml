name: Refresh Metadata

on:
  schedule:
    - cron: "0 3 * * 0"  # weekly incremental refresh (Sundays 03:00 UTC)
    - cron: "0 4 1 * *"  # monthly full re-baseline (1st of month, 04:00 UTC)
  workflow_dispatch:
    inputs:
      full:
        description: "Force a full re-crawl (re-baselines star counts)"
        type: boolean
        default: false

concurrency:
  group: refresh-pipeline
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.CRAWLER_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install crawler deps
        working-directory: crawler
        run: pip install -r requirements.txt
      - name: Run metadata crawl
        working-directory: crawler
        # --workers 2, not the crawler's default 5: GitHub's secondary
        # rate limit is stricter on Actions runners' shared egress IPs
        # than on a developer machine, and 5 workers here spent every
        # cycle tripping it and waiting out the 60s global pause. See
        # ADR 0001's concurrency note for the measurement.
        #
        # Weekly runs are incremental (only repos pushed since the last
        # crawl); the monthly cron and a manual `full=true` dispatch do a
        # full re-baseline, which also refreshes star counts on repos that
        # changed rank without a new push. See ADR 0015.
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ] || \
             [ "${{ github.event.schedule }}" = "0 4 1 * *" ]; then
            echo "Running FULL metadata crawl (re-baseline)."
            python -m src.main --workers 2 --min-stars 200
          else
            echo "Running INCREMENTAL metadata crawl."
            python -m src.main --workers 2 --min-stars 200 --incremental
          fi
      - name: Report progress
        run: python scripts/check_progress.py --stage report