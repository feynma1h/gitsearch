name: Refresh Index

on:
  workflow_run:
    workflows: ["Refresh READMEs"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: refresh-pipeline
  cancel-in-progress: false

jobs:
  # Only run when the last README chunk succeeded AND no work remains.
  # The previous workflow's last chunk emitted remaining=0, which bubbles up
  # via workflow_run; we re-probe here for correctness.
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      readme_done: ${{ steps.probe.outputs.readme_done }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r indexer/pipeline/requirements.txt
      - id: probe
        # Indexing should only start when README pass is fully drained; otherwise
        # we'd embed a partial corpus and have to redo the work next week.
        # check_progress.py: exit 0 = work remains, 1 = stage complete,
        # anything else = error. Only 1 means "drained" — an error must
        # not be read as one, or a 350-minute job starts on a bad probe.
        run: |
          set +e
          python scripts/check_progress.py --stage readme
          rc=$?
          set -e
          if [ $rc -gt 1 ]; then exit $rc; fi
          if [ $rc -eq 0 ]; then
            echo "readme_done=false" >> $GITHUB_OUTPUT
          else
            echo "readme_done=true" >> $GITHUB_OUTPUT
          fi

  index-chunk:
    needs: gate
    if: ${{ needs.gate.outputs.readme_done == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDING_SERVICE_URL: ${{ secrets.EMBEDDING_SERVICE_URL }}
      # If EMBEDDINGS_MODEL_LABEL is ever overridden, set it here at job
      # level: the pipeline and the progress probe both read it, and a
      # probe on a different label than the run either stops the chunk
      # chain early or never stops it.
    outputs:
      remaining: ${{ steps.probe.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install indexer deps
        working-directory: indexer
        run: pip install -r pipeline/requirements.txt
      - name: Run indexing chunk (5h budget)
        working-directory: indexer
        # `pipeline` must be importable as a package (main.py uses
        # relative imports), so run from indexer/, not indexer/pipeline/.
        run: python -m pipeline.main --top-n 100000 --deadline-seconds 18000
      - name: Probe remaining work
        id: probe
        # Exit 1 (stage complete) is a normal outcome here; anything
        # above that is a probe failure and must fail the job rather
        # than end it green with `remaining` unset.
        run: |
          set +e
          python scripts/check_progress.py --stage index
          rc=$?
          set -e
          if [ $rc -gt 1 ]; then exit $rc; fi

  rechunk:
    needs: index-chunk
    if: ${{ needs.index-chunk.outputs.remaining != '' && needs.index-chunk.outputs.remaining != '0' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_PAT }}
        run: |
          gh workflow run refresh-index.yml --ref ${{ github.ref }} \
            --repo ${{ github.repository }}

  finalize:
    needs: index-chunk
    if: ${{ needs.index-chunk.outputs.remaining == '0' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r indexer/pipeline/requirements.txt
      - name: Final report
        run: python scripts/check_progress.py --stage report
      - name: Regression check
        run: python scripts/check_regression.py